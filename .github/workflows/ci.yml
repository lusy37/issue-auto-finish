name: 工程回归
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e:install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run web:build
      - run: >-
          npm test -- --maxWorkers=2
          --exclude tests/integration/process-lifecycle.test.ts
          --exclude tests/integration/windows-preview.test.ts
      - run: npm run test:e2e
      - run: npm run test:windows
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-logs
          path: .iaf-mini/preview-tests/**/preview-logs/*.log
          if-no-files-found: ignore
          include-hidden-files: true
